name: Build feeds

on:
  schedule:
    - cron: '23 4 * * *' # daily; GitHub may start it hours late
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  # GitHub keeps one pending run per group and a newer run cancels it; with queue: max a scheduled
  # run queued behind a push build waits instead of being cancelled silently.
  queue: max

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs because this job holds the Cloudflare token; bumped by hand. The other
      # workflows hold no token and keep their tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The games earlier runs saw, so the build can tell a newly announced game from an old one for
      # the -alerts feeds (src/known-games.ts). They live in the Actions cache because the
      # protect-main ruleset rejects a commit back to main. A missing cache now fails a scheduled or
      # push run (the alert opens the ops issue), so a lost cache cannot silently reseed every team.
      # Seeding afresh, on the first run or after deleting the known-games caches, is a manual run.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: known-games.json
          key: known-games-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: known-games-
          fail-on-cache-miss: ${{ github.event_name != 'workflow_dispatch' }}
      # The sources' answers the last run used, so a push reuses them, however old, instead of asking
      # UEFA and FIBA again (src/answers.ts); the daily and manual runs always ask. A cache of its own:
      # a path added to the one above would change its version and lose the known games. As for any
      # cache, main restores only what main's own runs saved, never a pull request's.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: source-answers
          key: source-answers-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-answers-
      # A failed fetch stops here, so the last published calendars stay online.
      - run: npm run build
        env:
          SITE_URL: https://scarf.fan
      # dist/ as static assets on the Cloudflare Worker "scarf", which answers at scarf.fan
      # (wrangler.jsonc, docs/development.md "One-time setup").
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
      # Saved only once the feeds are live, so a failed run leaves the known games as they were. A
      # cache entry cannot be overwritten: each run saves its own, and restore-keys above picks the
      # newest. The concurrency group keeps two runs from interleaving.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: known-games.json
          key: known-games-${{ github.run_id }}-${{ github.run_attempt }}
      # Every run saves the answers it used, a push too, so a push that had to ask spares the next one.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: source-answers
          key: source-answers-${{ github.run_id }}-${{ github.run_attempt }}

  # GitHub disables a scheduled workflow after 60 days without repository activity, and this
  # repository only changes when a game's details do. Re-enabling the scheduled workflows through
  # the Actions API counts as activity and restarts that clock (GitHub does not document this;
  # the widely used keepalive actions rely on it, and docs/development.md "Keeping it running" says what to
  # watch for). Nothing is committed: the "protect-main" ruleset only accepts pull requests on
  # main, so a stamp commit pushed with GITHUB_TOKEN would be rejected. A push is activity by
  # itself, so this job only runs on the schedule and on a manual run. It does not depend on
  # the build, so a broken source keeps the schedule, and with it the failure alerts, alive.
  keepalive:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in publish.yml check-feeds.yml; do
            gh workflow enable "$workflow" --repo "$GITHUB_REPOSITORY"
            echo "$workflow is enabled; GitHub's 60-day inactivity clock starts again today"
          done

  # A failed run opens (or comments on) an "ops" issue; see alert.yml and docs/development.md.
  alert:
    needs: [publish, keepalive]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/alert.yml
