name: Build feeds

on:
  schedule:
    - cron: '23 4 * * *' # daily; GitHub may start it hours late
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The games earlier runs saw, so the build can tell a newly announced game from an old one for
      # the -alerts feeds (src/known-games.ts). They live in the Actions cache because the
      # protect-main ruleset rejects a commit back to main. With no cache (the first run, or GitHub
      # dropped it after 7 days unused) the build seeds the file again and announces nothing.
      - uses: actions/cache/restore@v6
        with:
          path: known-games.json
          key: known-games-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: known-games-
      # A failed fetch stops here, so the last published calendars stay online.
      - run: npm run build
        env:
          SITE_URL: https://scarf.fan
      # dist/ as static assets on the Cloudflare Worker "scarf", which answers at scarf.fan
      # (wrangler.jsonc, README "One-time setup").
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.0 deploy
      # Saved only once the feeds are live, so a failed run leaves the known games as they were. A
      # cache entry cannot be overwritten: each run saves its own, and restore-keys above picks the
      # newest. The concurrency group keeps two runs from interleaving.
      - uses: actions/cache/save@v6
        with:
          path: known-games.json
          key: known-games-${{ github.run_id }}-${{ github.run_attempt }}

  # GitHub disables a scheduled workflow after 60 days without repository activity, and this
  # repository only changes when a game's details do. Re-enabling the scheduled workflows through
  # the Actions API counts as activity and restarts that clock (GitHub does not document this;
  # the widely used keepalive actions rely on it, and README "Keeping it running" says what to
  # watch for). Nothing is committed: the "protect-main" ruleset only accepts pull requests on
  # main, so a stamp commit pushed with GITHUB_TOKEN would be rejected. A push is activity by
  # itself, so this job only runs on the schedule and on a manual run. It does not depend on
  # the build, so a broken source keeps the schedule, and with it the failure alerts, alive.
  keepalive:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in publish.yml check-feeds.yml; do
            gh workflow enable "$workflow" --repo "$GITHUB_REPOSITORY"
            echo "$workflow is enabled; GitHub's 60-day inactivity clock starts again today"
          done

  # A failed run opens (or comments on) an "ops" issue; see alert.yml and the README.
  alert:
    needs: [publish, keepalive]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/alert.yml
