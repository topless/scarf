name: Agent pickup

# Dragging a card to Ready on the board (github.com/users/topless/projects/3)
# starts the Claude cloud task "scarf: pick up Ready cards", which runs on the
# `ready` label. Personal boards send no events, so this checks every 10 minutes:
# a Ready card moves to In progress and gets `ready`; a card the agent answered
# with `needs-info` goes back to Backlog. Labelling an issue `ready` by hand
# starts the agent straight away.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency: agent-pickup

jobs:
  pickup:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      # Classic token with only the `project` scope: the Actions token can't see personal boards.
      BOARD_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PROJECT_ID: PVT_kwHOAAOFlc4BnbAe
      STATUS_FIELD: PVTSSF_lAHOAAOFlc4BnbAezhl_uYQ
      IN_PROGRESS: 47fc9ee4
      BACKLOG: f75ad846
    steps:
      - name: Pick up Ready cards, return answered ones to Backlog
        run: |
          set -euo pipefail
          move() {
            GH_TOKEN=$BOARD_TOKEN gh project item-edit --project-id "$PROJECT_ID" --id "$1" \
              --field-id "$STATUS_FIELD" --single-select-option-id "$2" > /dev/null
          }
          GH_TOKEN=$BOARD_TOKEN gh project item-list 3 --owner topless --format json --limit 500 \
            | jq -r --arg repo "$GH_REPO" '.items[]
                | select(.content.type == "Issue" and .content.repository == $repo)
                | [.id, .content.number, .status, ((.labels // []) | join(","))] | @tsv' \
            | while IFS=$'\t' read -r item number state labels; do
                case "$state" in
                  Ready)
                    move "$item" "$IN_PROGRESS"
                    # Remove first, so adding `ready` always fires a fresh labeled event.
                    gh issue edit "$number" --remove-label ready,needs-info > /dev/null
                    gh issue edit "$number" --add-label ready > /dev/null
                    echo "Picked up #$number" ;;
                  "In progress")
                    if [[ ",$labels," == *",needs-info,"* ]]; then
                      move "$item" "$BACKLOG"
                      echo "Back to Backlog: #$number"
                    fi ;;
                esac
              done
