name: Deploy staging

# #85, option B: puts any branch on the Worker scarf-staging at
# https://scarf-staging.topless.workers.dev, by hand only (Actions tab, "Deploy staging", "Run
# workflow", pick the branch). scarf.fan is never touched: env.staging in wrangler.jsonc sets no
# routes, so the custom domain stays with the Worker "scarf" that "Build feeds" deploys.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # From the test fixtures, so this run asks UEFA and FIBA nothing: the one request per source
      # per run belongs to the daily build. Pages and feeds point at the staging address.
      - run: npm run build:fixtures
        env:
          SITE_URL: https://scarf-staging.topless.workers.dev
      # Workers reads dist/_headers and adds the header to every asset it serves.
      - name: Keep staging out of search engines
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > dist/_headers
      - name: Deploy to Cloudflare Workers (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.0 deploy --env staging
